<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif"><rect x="0" y="0" width="1100" height="610" rx="0" fill="#0f172a"/><rect x="0" y="0" width="1100" height="56" rx="0" fill="#1e293b"/><text x="24" y="35" fill="#e2e8f0" font-size="18" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" text-anchor="start">🛡️ AWS Security Agent</text><text x="250" y="35" fill="#94a3b8" font-size="13" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" text-anchor="start">검증 콘솔 — 로그/이벤트를 붙여넣어 파싱·정규화·필터 결과를 확인</text><line x1="0" y1="56" x2="1100" y2="56" stroke="#334155"/><rect x="24" y="120" width="520" height="470" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/><rect x="40" y="136" width="141" height="32" rx="8" fill="#273449" stroke="#38bdf8" stroke-width="1"/><text x="110.5" y="157" fill="#e2e8f0" font-size="13" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" text-anchor="middle">써드파티 방화벽 로그</text><rect x="189" y="136" width="163" height="32" rx="8" fill="#273449" stroke="#334155" stroke-width="1"/><text x="270.5" y="157" fill="#94a3b8" font-size="13" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" text-anchor="middle">AWS 이벤트(JSON)</text><text x="40" y="198" fill="#94a3b8" font-size="12" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" text-anchor="start">벤더</text><rect x="40" y="206" width="180" height="30" rx="8" fill="#273449" stroke="#334155" stroke-width="1"/><text x="50" y="226" fill="#e2e8f0" font-size="13" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" text-anchor="start">auto  ▾</text><text x="40" y="260" fill="#94a3b8" font-size="12" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" text-anchor="start">방화벽 로그 (한 줄에 하나)</text><rect x="40" y="268" width="488" height="150" rx="8" fill="#0b1220" stroke="#334155" stroke-width="1"/><text x="50" y="288" fill="#94a3b8" font-size="12.5" font-weight="normal" font-family="ui-monospace,Menlo,monospace" text-anchor="start">예) devname=... type=utm subtype=ips level=alert srcip=... attack=.</text><rect x="40" y="430" width="166.0" height="22" rx="11" fill="#273449" stroke="#334155" stroke-width="1"/><text x="123.0" y="445" fill="#94a3b8" font-size="11.5" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" text-anchor="middle">Fortinet (IPS/alert)</text><rect x="212.0" y="430" width="151.20000000000002" height="22" rx="11" fill="#273449" stroke="#334155" stroke-width="1"/><text x="287.6" y="445" fill="#94a3b8" font-size="11.5" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" text-anchor="middle">Palo Alto (THREAT)</text><rect x="369.20000000000005" y="430" width="99.4" height="22" rx="11" fill="#273449" stroke="#334155" stroke-width="1"/><text x="418.90000000000003" y="445" fill="#94a3b8" font-size="11.5" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" text-anchor="middle">Check Point</text><rect x="40" y="458" width="77.2" height="22" rx="11" fill="#273449" stroke="#334155" stroke-width="1"/><text x="78.6" y="473" fill="#94a3b8" font-size="11.5" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" text-anchor="middle">CEF (공통)</text><text x="40" y="520" fill="#94a3b8" font-size="12" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" text-anchor="start">최소 심각도(필터)</text><rect x="40" y="528" width="150" height="30" rx="8" fill="#273449" stroke="#334155" stroke-width="1"/><text x="50" y="548" fill="#e2e8f0" font-size="13" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" text-anchor="start">MEDIUM  ▾</text><rect x="205" y="526" width="42" height="34" rx="8" fill="#38bdf8"/><text x="226.0" y="548" fill="#04283b" font-size="13" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" text-anchor="middle">분석</text><rect x="257" y="526" width="51" height="34" rx="8" fill="#273449" stroke="#334155" stroke-width="1"/><text x="282.5" y="548" fill="#e2e8f0" font-size="13" font-weight="600" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" text-anchor="middle">지우기</text><rect x="560" y="120" width="516" height="470" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/><text x="818.0" y="350" fill="#94a3b8" font-size="13" font-weight="normal" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif" text-anchor="middle">결과가 여기에 표시됩니다.</text></svg>